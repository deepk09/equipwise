<style>
/* ==========================================================================
   EquipWise — industrial construction-finance dashboard
   ========================================================================== */

:root {
  --navy-950: #071426;
  --navy-900: #0A1C31;
  --navy-800: #0E2740;
  --navy-700: #143454;
  --navy-600: #1C4568;
  --ink: #0E1F2E;
  --ink-2: #35485A;
  --ink-3: #66788A;
  --ink-4: #94A3B0;

  --paper: #F2F5F7;
  --surface: #FFFFFF;
  --surface-2: #F8FAFB;
  --line: #E2E8ED;
  --line-2: #D2DBE3;

  --yellow: #E8A317;
  --yellow-soft: #FCEFD2;
  --yellow-line: #F3D79A;
  --teal: #2E7D8F;
  --teal-soft: #E2F0F3;
  --green: #1F7A4D;
  --green-soft: #E2F2EA;
  --red: #B3261E;
  --red-soft: #FBE7E5;

  --buy: #143454;
  --lease: #D99413;
  --rent: #2E7D8F;

  --r-sm: 6px;
  --r: 10px;
  --r-lg: 14px;
  --shadow-1: 0 1px 2px rgba(10, 28, 49, .06), 0 1px 3px rgba(10, 28, 49, .04);
  --shadow-2: 0 4px 12px rgba(10, 28, 49, .07), 0 1px 3px rgba(10, 28, 49, .05);
  --shadow-3: 0 18px 40px -18px rgba(10, 28, 49, .35);

  --f-head: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-body);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.55;
}
h1, h2, h3, h4 { font-family: var(--f-head); font-weight: 600; letter-spacing: -.015em; margin: 0; color: var(--navy-900); }
p { margin: 0 0 .7em; }
a { color: var(--navy-700); }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; font-size: 14px; }
::selection { background: var(--yellow-soft); }

.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.dim { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.nowrap { white-space: nowrap; }

/* ------------------------------------------------------------ top bar --- */
.topbar {
  background: var(--navy-900);
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: sticky; top: 0; z-index: 60;
}
.topbar__inner {
  max-width: 1320px; margin: 0 auto; padding: 0 22px;
  height: 62px; display: flex; align-items: center; gap: 26px;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; flex-shrink: 0; }
.brand__mark { width: 30px; height: 30px; display: block; }
.brand__name {
  font-family: var(--f-head); font-size: 19px; font-weight: 700; color: #fff;
  letter-spacing: -.02em; line-height: 1;
}
.brand__name span { color: var(--yellow); }
.brand__sub {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .16em;
  color: rgba(255,255,255,.45); text-transform: uppercase; margin-top: 3px;
}
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button {
  background: transparent; border: 0; color: rgba(255,255,255,.62);
  padding: 8px 13px; border-radius: 7px; font-size: 13.5px; font-weight: 500;
  white-space: nowrap; transition: background .15s, color .15s;
}
.nav button:hover { color: #fff; background: rgba(255,255,255,.07); }
.nav button.on { color: var(--navy-950); background: var(--yellow); font-weight: 600; }
.topbar__chip {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em;
  color: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.18);
  padding: 4px 8px; border-radius: 5px; flex-shrink: 0;
}

/* ---------------------------------------------------------------- hero --- */
.hero {
  background:
    radial-gradient(1000px 340px at 88% -20%, rgba(232,163,23,.20), transparent 70%),
    linear-gradient(168deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);
  color: #fff; position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.85), transparent 92%);
  pointer-events: none;
}
.hero__inner { position: relative; padding-top: 54px; padding-bottom: 46px; display: grid; grid-template-columns: 1.55fr .95fr; gap: 46px; align-items: center; }
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--yellow); margin-bottom: 16px;
}
.hero__eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--yellow); }
.hero h1 { color: #fff; font-size: clamp(30px, 4vw, 47px); line-height: 1.06; letter-spacing: -.03em; }
.hero h1 em { font-style: normal; color: var(--yellow); }
.hero__lede { color: rgba(255,255,255,.76); font-size: 16px; max-width: 54ch; margin-top: 16px; }
.hero__cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; align-items: center; }

.btn {
  border: 0; border-radius: 8px; padding: 12px 20px; font-size: 14.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 9px; transition: transform .12s, box-shadow .18s, background .18s;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--yellow); color: var(--navy-950); box-shadow: 0 6px 18px -8px rgba(232,163,23,.9); }
.btn--primary:hover { background: #F5B229; }
.btn--ghost { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.btn--ghost:hover { background: rgba(255,255,255,.14); }
.btn--dark { background: var(--navy-800); color: #fff; }
.btn--dark:hover { background: var(--navy-700); }
.btn--line { background: #fff; color: var(--navy-800); border: 1px solid var(--line-2); }
.btn--line:hover { border-color: var(--navy-600); }
.btn--sm { padding: 8px 13px; font-size: 13px; border-radius: 7px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.hero__panel {
  background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13);
  border-radius: var(--r-lg); padding: 18px 20px; backdrop-filter: blur(6px);
}
.hero__panel h4 {
  color: rgba(255,255,255,.55); font-family: var(--f-mono); font-size: 10.5px;
  letter-spacing: .16em; text-transform: uppercase; font-weight: 500; margin-bottom: 14px;
}
.hero__row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,.11); }
.hero__row:last-child { border-bottom: 0; }
.hero__row span:first-child { font-size: 13px; color: rgba(255,255,255,.7); }
.hero__row span:last-child { font-family: var(--f-mono); font-size: 15px; color: #fff; font-weight: 500; }
.hero__row.win span:last-child { color: var(--yellow); }

/* -------------------------------------------------------------- layout --- */
.page { padding-top: 40px; padding-bottom: 84px; }
.section { margin-bottom: 42px; }
/* consistent vertical spacing between sibling blocks on every page */
.page > * + * { margin-top: 20px; }
.section > * + * { margin-top: 20px; }

.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; flex-wrap: wrap; }
.sec-head h2 { font-size: 21px; }
.sec-head p { margin: 5px 0 0; color: var(--ink-3); font-size: 13.5px; max-width: 78ch; }
.label {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 9px;
}
.label::before { content: ""; width: 6px; height: 6px; background: var(--yellow); border-radius: 1px; }

.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
.g-auto-sm { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-1); padding: 22px;
  min-width: 0;
}
.card--flush { padding: 0; overflow: hidden; }
.card--tint { background: linear-gradient(180deg, #fff, var(--surface-2)); }
.card h3 { font-size: 15.5px; }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.card__head .kicker { font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-4); }

/* ---------------------------------------------------------- stat cards --- */
.stat { position: relative; overflow: hidden; }
.stat::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line-2);
}
.stat--buy::after { background: var(--buy); }
.stat--lease::after { background: var(--lease); }
.stat--rent::after { background: var(--rent); }
.stat--win::after { background: var(--green); }
.stat__k { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); }
.stat__v { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; margin: 8px 0 2px; color: var(--navy-900); }
.stat__v small { font-size: 12px; color: var(--ink-4); font-weight: 400; letter-spacing: 0; }
.stat__m { font-size: 12.5px; color: var(--ink-3); }
.stat--win { background: linear-gradient(160deg, #fff, var(--green-soft)); border-color: #BFDCCB; }
.stat--win .stat__v { color: var(--green); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono);
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap;
}
.badge--win { background: var(--green-soft); color: var(--green); border-color: #BFDCCB; }
.badge--buy { background: #E7EDF4; color: var(--buy); }
.badge--lease { background: var(--yellow-soft); color: #8A5F06; }
.badge--rent { background: var(--teal-soft); color: var(--teal); }
.badge--warn { background: var(--yellow-soft); color: #8A5F06; border-color: var(--yellow-line); }
.badge--err { background: var(--red-soft); color: var(--red); border-color: #F1C7C3; }
.badge--muted { background: var(--surface-2); color: var(--ink-3); border-color: var(--line); }

/* ---------------------------------------------------------------- form --- */
.field { display: block; margin-bottom: 13px; }
.field__label {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 5px;
}
.field__label .u { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: .04em; }
.input, .select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.input:hover, .select:hover { border-color: #B9C5D0; }
.input:focus, .select:focus {
  outline: none; border-color: var(--navy-600);
  box-shadow: 0 0 0 3px rgba(20,52,84,.10);
}
.input.num { text-align: right; font-family: var(--f-mono); }
.input.err { border-color: #D86A62; background: #FFF8F7; }
.field__hint { font-size: 11.5px; color: var(--ink-4); margin-top: 4px; line-height: 1.4; }
.field__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field__row--3 { grid-template-columns: 1fr 1fr 1fr; }

.toggle { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
.toggle input { appearance: none; width: 36px; height: 20px; border-radius: 20px; background: #CBD5DD; position: relative; transition: background .18s; flex-shrink: 0; margin-top: 1px; cursor: pointer; }
.toggle input::after {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px; transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.toggle input:checked { background: var(--navy-700); }
.toggle input:checked::after { transform: translateX(16px); }
.toggle__txt { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.toggle__txt b { display: block; font-weight: 500; color: var(--ink); font-size: 13px; }
.toggle__txt span { color: var(--ink-4); font-size: 11.5px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; border-radius: 5px;
  font-size: 12.5px; color: var(--ink-3); font-weight: 500;
}
.seg button.on { background: #fff; color: var(--navy-800); box-shadow: var(--shadow-1); font-weight: 600; }

/* --------------------------------------------------------------- table --- */
.tbl-wrap {
  overflow-x: auto; border-radius: var(--r);
  scrollbar-width: thin; -webkit-overflow-scrolling: touch;
}
.tbl-wrap::-webkit-scrollbar { height: 7px; }
.tbl-wrap::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.tbl-wrap::-webkit-scrollbar-track { background: transparent; }

.tbl-wrap--scroll {
  background:
    linear-gradient(to right, #fff 20%, rgba(255,255,255,0)) left center,
    linear-gradient(to left, #fff 20%, rgba(255,255,255,0)) right center,
    radial-gradient(farthest-side at 0 50%, rgba(10,28,49,.16), rgba(10,28,49,0)) left center,
    radial-gradient(farthest-side at 100% 50%, rgba(10,28,49,.16), rgba(10,28,49,0)) right center;
  background-repeat: no-repeat;
  background-size: 26px 100%, 26px 100%, 14px 100%, 14px 100%;
  background-attachment: local, local, scroll, scroll;
}
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl--wide { min-width: 760px; }   /* 11-column audit table */
@media (max-width: 1100px) {
  table.tbl--wide { font-size: 11.5px; min-width: 0; }
  table.tbl--wide th, table.tbl--wide td { padding-left: 9px; padding-right: 9px; }
  .col-md-hide { display: none; }
  .tbl-foot .only-narrow { display: inline; }
}
table.tbl th, table.tbl td { padding: 10px 13px; text-align: right; border-bottom: 1px solid var(--line); }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
table.tbl thead th {
  background: var(--navy-900); color: rgba(255,255,255,.85);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; font-weight: 500; white-space: nowrap;
  border-bottom: 0; position: sticky; top: 0;
}
table.tbl thead th.col-buy { color: #B9D2EA; }
table.tbl thead th.col-lease { color: #F3CE86; }
table.tbl thead th.col-rent { color: #9DD4DF; }
table.tbl tbody tr:nth-child(even) { background: var(--surface-2); }
table.tbl tbody tr:hover { background: #F0F5F9; }
table.tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tbl td.best { color: var(--green); font-weight: 600; }
table.tbl tr.row-strong td { background: #EEF3F8; font-weight: 600; border-top: 1px solid var(--line-2); }
table.tbl tr.row-strong:hover td { background: #E8EFF6; }
table.tbl td.lbl { color: var(--ink-2); }
table.tbl td.lbl small { display: block; color: var(--ink-4); font-size: 11px; }
.be-strip {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--line); margin-top: 16px;
}
.be-strip__cell { padding: 16px 22px 6px; border-right: 1px solid var(--line); min-width: 0; }
.be-strip__cell:last-child { border-right: 0; padding-right: 0; }
.be-strip__cell:first-child { padding-left: 0; }
.be-strip__k {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-4);
}
.be-strip__v { font-family: var(--f-mono); font-size: 21px; color: var(--navy-900); margin: 7px 0 5px; letter-spacing: -.01em; }
.be-strip__v.none { font-size: 15px; color: var(--ink-3); }
.be-strip__n { font-size: 12px; color: var(--ink-3); line-height: 1.5; }

.be-now {
  margin-top: 16px; padding: 13px 15px; border-radius: var(--r-sm);
  background: #EDF3F8; border-left: 3px solid var(--navy-600);
  font-size: 12.5px; color: var(--ink-2); line-height: 1.55;
}
.be-now__k {
  display: block; font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-4); margin-bottom: 4px;
}

table.tbl--roomy th, table.tbl--roomy td { padding-top: 11px; padding-bottom: 11px; }

.only-narrow { display: none; }

.cf-summary { border-top: 1px solid var(--line-2); background: #EEF3F8; }
.cf-summary__row {
  display: grid; grid-template-columns: 130px 1fr auto; gap: 16px; align-items: baseline;
  padding: 12px 13px; border-bottom: 1px solid var(--line);
}
.cf-summary__row:last-child { border-bottom: 0; }
.cf-summary__k { font-weight: 600; font-size: 13px; color: var(--navy-900); }
.cf-summary__n { font-size: 11.5px; color: var(--ink-3); }
.cf-summary__v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-weight: 600; }

@media (max-width: 700px) {
  .cf-summary__row { grid-template-columns: 1fr auto; gap: 10px; }
  .cf-summary__n { display: none; }
}
.tbl-foot { font-size: 11.5px; color: var(--ink-4); padding: 10px 13px; border-top: 1px solid var(--line); background: var(--surface-2); }

/* -------------------------------------------------------------- charts --- */
.chartbox { position: relative; width: 100%; }
.chartbox canvas { max-width: 100%; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.chart-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* --------------------------------------------------------- equipment ----- */
.equip {
  display: flex; flex-direction: column; gap: 10px; padding: 16px; cursor: pointer; position: relative;
  transition: border-color .16s, box-shadow .18s, transform .16s; text-align: left;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
}
.equip:hover { border-color: var(--navy-600); box-shadow: var(--shadow-2); transform: translateY(-2px); }
.equip.on { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow-soft); }
.equip__icon { width: 44px; height: 32px; color: var(--navy-700); }
.equip__name { font-family: var(--f-head); font-size: 14.5px; font-weight: 600; color: var(--navy-900); }
.equip__spec { font-size: 11.5px; color: var(--ink-4); line-height: 1.35; }
.equip__price { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: auto; }
.equip__price b { color: var(--navy-800); font-weight: 600; }

.equip__actions { position: absolute; top: 9px; right: 9px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.equip:hover .equip__actions, .equip:focus-within .equip__actions { opacity: 1; }
.equip__actions button {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line-2); background: #fff;
  color: var(--ink-3); line-height: 1.3;
}
.equip__actions button:hover { border-color: var(--navy-600); color: var(--navy-800); }
.equip__actions button.del:hover { border-color: #D86A62; color: var(--red); background: var(--red-soft); }
.equip__tag {
  display: inline-block; font-family: var(--f-mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: #8A5F06; background: var(--yellow-soft);
  border: 1px solid var(--yellow-line); border-radius: 3px; padding: 1px 5px; margin-left: 6px;
  vertical-align: middle;
}
.equip--add {
  border-style: dashed; align-items: center; justify-content: center; text-align: center;
  color: var(--ink-3); min-height: 158px; background: transparent;
}
.equip--add:hover { color: var(--navy-800); background: #fff; }
.equip--add .plus {
  width: 34px; height: 34px; border-radius: 50%; border: 1px dashed var(--line-2);
  display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--ink-4);
  margin: 0 auto 4px;
}
.equip--add:hover .plus { border-color: var(--navy-600); color: var(--navy-700); }

.equip-form { border-color: var(--yellow-line); background: linear-gradient(180deg, #fff, #FFFCF5); }
.equip-form__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 0 14px; }
.equip-form__grid .field__label { min-height: 26px; align-items: flex-start; }
.equip-form__grid .field__label .u { text-align: right; line-height: 1.25; max-width: 62%; }
.equip-form__foot { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); }

@media (hover: none) {
  .equip__actions { opacity: 1; }
}

/* ------------------------------------------------------------- misc ------ */
.note {
  border-left: 3px solid var(--yellow); background: var(--yellow-soft);
  padding: 12px 15px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 13px; color: #5C4405;
}
.note--info { border-color: var(--navy-600); background: #EDF3F8; color: var(--ink-2); }
.note--err { border-color: var(--red); background: var(--red-soft); color: #7A1B15; }
.note--ok { border-color: var(--green); background: var(--green-soft); color: #145C39; }
.note b { font-weight: 600; }
.note ul { margin: 6px 0 0; padding-left: 18px; }
.note li { margin-bottom: 3px; }

.formula {
  background: var(--navy-950); color: #DCE7F2; border-radius: var(--r);
  padding: 16px 18px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.9;
  overflow-x: auto;
}
.formula .cmt { color: #7E93A8; }
.formula .hl { color: var(--yellow); }
.formula .op { color: #9DD4DF; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
.frac .n { border-bottom: 1px solid #93A7BA; padding: 0 6px 2px; }
.frac .d { padding: 2px 6px 0; }

.assump { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.assump__item { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; background: var(--surface-2); }
.assump__item h5 { margin: 0 0 5px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.assump__item p { margin: 0; font-size: 12.5px; color: var(--ink-2); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); color: var(--ink); }

.tabs-inline { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs-inline button {
  border: 1px solid var(--line-2); background: #fff; padding: 6px 12px; border-radius: 20px;
  font-size: 12.5px; color: var(--ink-3);
}
.tabs-inline button.on { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }

.scn-save {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding-bottom: 16px; margin-bottom: 6px; border-bottom: 1px solid var(--line);
}
.scn-save .input { flex: 1 1 280px; min-width: 0; }
.scn-list { display: flex; flex-direction: column; }
.scn {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 13px 0; border-bottom: 1px dashed var(--line);
}
.scn:last-child { border-bottom: 0; padding-bottom: 0; }
.scn__main { min-width: 0; flex: 1 1 auto; }
.scn__name { font-weight: 500; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.scn__meta { font-size: 11.5px; color: var(--ink-4); margin-top: 2px; }
.scn__acts { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.scn__acts .btn { padding: 6px 10px; font-size: 12px; }
.scn__acts .scn__del:hover { color: var(--red); border-color: #D86A62; }
.scn__rename { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scn__rename .input { flex: 1 1 220px; min-width: 0; }
.scn-empty {
  border: 1px dashed var(--line-2); border-radius: var(--r-sm); background: var(--surface-2);
  padding: 18px 20px; font-size: 13px; color: var(--ink-3); line-height: 1.6;
}
.scn-empty b { color: var(--ink-2); }
.kv dd { overflow-wrap: anywhere; }

@media (max-width: 620px) {
  .scn { flex-direction: column; align-items: stretch; gap: 10px; }
  .scn__acts { justify-content: flex-start; }
}

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--navy-900); color: #fff; padding: 11px 18px; border-radius: 8px;
  font-size: 13.5px; box-shadow: var(--shadow-3); z-index: 200;
  display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--yellow);
  animation: toastIn .22s ease-out;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.sticky-rail { position: sticky; top: 78px; }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: #fff; }
.step { padding: 18px 20px; border-right: 1px solid var(--line); }
.step:last-child { border-right: 0; }
.step__n { font-family: var(--f-mono); font-size: 11px; color: var(--yellow); letter-spacing: .12em; }
.step h4 { font-size: 14.5px; margin: 6px 0 4px; }
.step p { font-size: 12.5px; color: var(--ink-3); margin: 0; }

.footer { border-top: 1px solid var(--line); padding: 22px 0 34px; color: var(--ink-4); font-size: 12px; }
.footer b { color: var(--ink-3); font-weight: 500; }

.report-preview { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 26px 30px; box-shadow: var(--shadow-2); }
.report-preview h3 { font-size: 17px; border-bottom: 2px solid var(--navy-800); padding-bottom: 8px; margin-bottom: 12px; }
.report-preview ol { padding-left: 20px; color: var(--ink-2); font-size: 13px; line-height: 2; }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }

@media (max-width: 1080px) {
  .hero__inner { grid-template-columns: 1fr; gap: 30px; padding-top: 40px; padding-bottom: 34px; }
  .split { grid-template-columns: 1fr; }
  .sticky-rail { position: static; }
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .topbar__inner { height: auto; padding: 10px 15px; flex-wrap: wrap; gap: 10px; }
  .nav { margin-left: 0; width: 100%; }
  .topbar__chip { display: none; }
  .hero h1 { font-size: 29px; }
  .g2, .g3, .g4, .g-auto, .g-auto-sm { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; }
  .step { border-right: 0; border-bottom: 1px solid var(--line); }
  .field__row, .field__row--3 { grid-template-columns: 1fr 1fr; }
  .card { padding: 17px; }
  .stat__v { font-size: 22px; }
  .page { padding-top: 26px; padding-bottom: 56px; }

<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A1C31;color:#8FA6BC;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em">
    LOADING EQUIPWISE&hellip;
  </div>
</div>
<noscript>
  <div style="padding:40px;font-family:system-ui,sans-serif;max-width:640px;margin:0 auto">
    <h1 style="font-size:22px">EquipWise needs JavaScript</h1>
    <p>This is an interactive engineering-economics calculator. Enable JavaScript in your browser to run the
    EUAC comparison, break-even and sensitivity analysis.</p>
  </div>
</noscript>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<!-- ================= calculation engine (pure, UI-independent) ================= -->
<script>
/* =========================================================================
   EquipWise — Engineering Economics Calculation Engine
   Equivalent Uniform Annual Cost (EUAC) / Equivalent Uniform Annual Worth
   Pure functions. No DOM. No UI. Reproducible.
   ========================================================================= */
(function (global) {
  'use strict';

  var Engine = {};

  /* ---------------------------------------------------------------- utils */
  function num(v) { var x = parseFloat(v); return isFinite(x) ? x : 0; }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  Engine.num = num;
  Engine.deepClone = deepClone;

  /* -------------------------------------------------------------- factors */
  /* (A/P, i, n) capital recovery factor. Zero-rate case handled separately. */
  function apf(i, n) {
    if (!(n > 0)) return 0;
    if (Math.abs(i) < 1e-12) return 1 / n;
    var p = Math.pow(1 + i, n);
    return (i * p) / (p - 1);
  }
  /* (A/F, i, n) sinking fund factor. */
  function af(i, n) {
    if (!(n > 0)) return 0;
    if (Math.abs(i) < 1e-12) return 1 / n;
    return i / (Math.pow(1 + i, n) - 1);
  }
  /* (P/F, i, n) single payment present worth factor. */
  function pfv(i, n) { return Math.pow(1 + i, -n); }
  /* (P/A, i, n) uniform series present worth factor. */
  function paf(i, n) {
    if (!(n > 0)) return 0;
    if (Math.abs(i) < 1e-12) return n;
    return (1 - Math.pow(1 + i, -n)) / i;
  }
  /* Effective periodic rate from an annual effective rate. */
  function periodRate(iAnnual, perYear) {
    if (Math.abs(iAnnual) < 1e-12) return 0;
    return Math.pow(1 + iAnnual, 1 / perYear) - 1;
  }

  Engine.apf = apf; Engine.af = af; Engine.pfv = pfv; Engine.paf = paf;
  Engine.periodRate = periodRate;

  /* --------------------------------------------------------- derived bits */
  function productiveHours(inp) {
    var h = num(inp.project.hoursPerYear);
    var u = clamp(num(inp.project.utilizationPct), 0, 100);
    return h * u / 100;
  }
  Engine.productiveHours = productiveHours;

  function analysisYears(inp) {
    var n = num(inp.project.analysisYears);
    if (!(n > 0)) n = num(inp.project.durationMonths) / 12;
    return Math.max(n, 1 / 12);
  }
  Engine.analysisYears = analysisYears;

  /* Component buckets used everywhere (capital + salvage = capital recovery) */
  var KEYS = ['capital', 'maint', 'oper', 'own', 'lease', 'other', 'salvage'];
  Engine.KEYS = KEYS;

  function emptyFlow(t) {
    return { t: t, capital: 0, maint: 0, oper: 0, own: 0, lease: 0, other: 0, salvage: 0 };
  }
  function pushFlow(arr, t, key, amt) {
    if (!amt) return;
    var f = null;
    for (var k = 0; k < arr.length; k++) { if (Math.abs(arr[k].t - t) < 1e-9) { f = arr[k]; break; } }
    if (!f) { f = emptyFlow(t); arr.push(f); }
    f[key] += amt;
  }

  /* ======================================================================
     BUY  —  ownership cash-flow stream
     EUAC_B = PW_B (A/P, i, n),  PW_B = P + sum C_t/(1+i)^t - S/(1+i)^n
     ====================================================================== */
  function buyFlows(inp, nYears) {
    var b = inp.buy, e = inp.econ;
    var price = num(b.price);
    var life = Math.max(0.25, num(b.economicLifeYears) || nYears);
    var replace = !!b.replacement && nYears > life + 1e-9;
    var cycles = replace ? Math.ceil(nYears / life - 1e-9) : 1;
    var dpPct = clamp(num(b.downPaymentPct), 0, 100);
    var tenure = num(b.loanTenureYears);
    var loanRate = num(b.loanRate) / 100;
    var dp = price * dpPct / 100;
    var loan = price - dp;
    var ownerView = (b.financingView === 'owner') && dpPct < 100 && tenure > 0 && loan > 0 && !replace;
    var A = (loan > 0 && tenure > 0) ? loan * apf(loanRate, tenure) : 0;

    var taxRate = num(e.taxRate) / 100;
    var atF = e.afterTax ? (1 - taxRate) : 1;
    var infl = num(e.inflationRate) / 100;
    var hours = productiveHours(inp);
    var resale = num(b.resaleValue);
    var ownAnnual = num(b.insuranceAnnual) + num(b.registrationAnnual) +
                    num(b.storageAnnual) + num(b.otherAnnual);
    var opAnnual = num(b.operatingCostPerHour) * hours;
    var m1 = num(b.maintenanceYear1);
    var g = num(b.maintenanceEscalationPct) / 100;
    var depBase = Math.max(0, price - resale);

    var flows = [];
    var detail = { cycles: cycles, replace: replace, ownerView: ownerView, loanPayment: A,
                   downPayment: dp, loan: loan, life: life };

    for (var k = 0; k < cycles; k++) {
      var start = k * life;
      if (start >= nYears - 1e-9) break;
      var len = Math.min(life, nYears - start);
      var fullCycle = len >= life - 1e-9;

      /* --- capital outlay at the start of the cycle --- */
      if (ownerView) pushFlow(flows, start, 'capital', dp);
      else pushFlow(flows, start, 'capital', price);

      /* --- loan repayments (owner's financing cash flows) --- */
      if (ownerView) {
        var payYears = Math.min(tenure, len);
        for (var y1 = 1; y1 <= Math.ceil(payYears - 1e-9); y1++) {
          var frac = Math.min(1, payYears - (y1 - 1));
          if (frac <= 1e-9) break;
          pushFlow(flows, start + y1 - 1 + frac, 'other', A * frac);
        }
      }

      /* --- recurring annual costs, prorated for partial years --- */
      var nPeriods = Math.ceil(len - 1e-9);
      for (var y = 0; y < nPeriods; y++) {
        var overlap = Math.min(1, len - y);
        if (overlap <= 1e-9) break;
        var t = start + y + overlap;
        var gYear = Math.floor(start + y);
        var escInfl = Math.pow(1 + infl, gYear);

        var maint = m1 * Math.pow(1 + g, y) * overlap;
        var own = ownAnnual * escInfl * overlap;
        var op = opAnnual * escInfl * overlap;

        if (maint) pushFlow(flows, t, 'maint', maint * atF);
        if (own) pushFlow(flows, t, 'own', own * atF);
        if (op) pushFlow(flows, t, 'oper', op * atF);

        /* straight-line depreciation tax shield */
        if (e.afterTax && taxRate > 0 && life > 0) {
          var shield = taxRate * (depBase / life) * overlap;
          if (shield) pushFlow(flows, t, 'other', -shield);
        }
      }

      /* --- terminal resale value at the end of the cycle --- */
      var endT = start + len;
      var sal = resale;
      if (ownerView && tenure > nYears) {
        var rem = tenure - nYears;
        var bal = loanRate > 0 ? A * paf(loanRate, rem) : A * rem;
        sal = resale - bal;   /* sale proceeds must clear the outstanding loan */
        detail.balanceAtEnd = bal;
      }
      if (sal) pushFlow(flows, endT, 'salvage', -sal);
      if (!fullCycle && !replace) detail.partial = true;
    }

    return { granularity: 'annual', flows: flows, detail: detail };
  }

  /* ======================================================================
     LEASE
     ====================================================================== */
  function leaseFlows(inp, nYears) {
    var l = inp.lease, e = inp.econ;
    var months = Math.max(1, Math.round(nYears * 12));
    var term = Math.max(1, Math.round(num(l.termMonths) || months));
    var cycles = Math.ceil(months / term - 1e-9);
    var base = num(l.payment);
    var esc = num(l.escalationPct) / 100;
    var taxRate = num(e.taxRate) / 100;
    var atF = e.afterTax ? (1 - taxRate) : 1;
    var infl = num(e.inflationRate) / 100;
    var hours = productiveHours(inp);
    var flows = [];
    var deposit = num(l.deposit);
    var lesseeMaint = (l.maintenanceResponsibility === 'lessee') ? num(l.lesseeMaintenanceAnnual) : 0;
    var lesseeIns = num(l.lesseeInsuranceAnnual);
    var opPerHr = num(l.operatingCostPerHour);
    var adv = num(l.advancePayment);
    var termPay = num(l.terminationPayment);
    var monthsPerPayment = (l.paymentFrequency === 'annual') ? 12 : 1;

    for (var k = 0; k < cycles; k++) {
      var startM = k * term;
      if (startM >= months) break;
      var len = Math.min(term, months - startM);

      if (adv) pushFlow(flows, startM, 'other', adv * atF);
      if (deposit) pushFlow(flows, startM, 'other', deposit);   /* refundable: not tax-effected */

      for (var m = 1; m <= len; m++) {
        var mm = startM + m;
        var yearIdx = Math.floor((mm - 1) / 12);
        var pay = base * Math.pow(1 + esc, yearIdx);
        if (monthsPerPayment === 12) {
          if (mm % 12 === 0) pushFlow(flows, mm, 'lease', pay * atF);
        } else {
          pushFlow(flows, mm, 'lease', pay * atF);
        }
        if (lesseeMaint) pushFlow(flows, mm, 'maint', (lesseeMaint / 12) * Math.pow(1 + infl, yearIdx) * atF);
        if (lesseeIns) pushFlow(flows, mm, 'own', (lesseeIns / 12) * Math.pow(1 + infl, yearIdx) * atF);
        if (opPerHr) pushFlow(flows, mm, 'oper', (opPerHr * hours / 12) * Math.pow(1 + infl, yearIdx) * atF);
      }

      /* refundable deposit returned at the end of the term */
      var retM = (cycles === 1 && num(l.depositReturnMonth) > 0)
        ? Math.min(months, Math.round(num(l.depositReturnMonth)))
        : startM + len;
      if (deposit) pushFlow(flows, retM, 'other', -deposit);
    }

    if (termPay) pushFlow(flows, months, 'other', termPay * atF);

    return { granularity: 'monthly', flows: flows,
             detail: { months: months, term: term, cycles: cycles } };
  }

  /* ======================================================================
     RENT
     ====================================================================== */
  function monthlyRentalRate(r) {
    var v = num(r.rateValue);
    if (r.rateBasis === 'day') return v * (num(r.daysPerMonth) || 26);
    if (r.rateBasis === 'week') return v * (52 / 12);
    return v;
  }
  Engine.monthlyRentalRate = monthlyRentalRate;

  function rentFlows(inp, nYears) {
    var r = inp.rent, e = inp.econ;
    var months = Math.max(1, Math.round(nYears * 12));
    var requested = Math.round(num(r.durationMonths));
    if (requested > 0) months = requested;   /* committed hire period */
    var taxRate = num(e.taxRate) / 100;
    var atF = e.afterTax ? (1 - taxRate) : 1;
    var infl = num(e.inflationRate) / 100;
    var hours = productiveHours(inp);
    var flows = [];
    var esc = num(r.escalationPct) / 100;
    var ot = num(r.overtimePerMonth);
    var dtPct = num(r.downtimePct) / 100;
    var minHire = num(r.minHireMonths);
    var opPerHr = num(r.fuelIncluded === false || r.operatorIncluded === false)
      ? num(r.renterOperatingCostPerHour) : 0;

    var sumCharge = 0;
    for (var m = 1; m <= months; m++) {
      var yearIdx = Math.floor((m - 1) / 12);
      var rate = monthlyRentalRate(r) * Math.pow(1 + esc, yearIdx);
      var charge = (rate + ot) * atF;
      pushFlow(flows, m, 'lease', charge);
      sumCharge += charge;
      if (opPerHr) pushFlow(flows, m, 'oper', (opPerHr * hours / 12) * Math.pow(1 + infl, yearIdx) * atF);
    }

    /* downtime / replacement-equipment allowance */
    if (dtPct > 0 && sumCharge > 0) {
      for (var m2 = 1; m2 <= months; m2++) {
        var yr2 = Math.floor((m2 - 1) / 12);
        var extra = monthlyRentalRate(r) * Math.pow(1 + esc, yr2) * dtPct * atF;
        pushFlow(flows, m2, 'other', extra);
      }
    }

    /* minimum hire shortfall: paid inside the study period */
    if (minHire > months) {
      var shortfall = (minHire - months) * monthlyRentalRate(r) * atF;
      pushFlow(flows, months, 'other', shortfall);
    }

    if (num(r.mobDemob)) {
      pushFlow(flows, 0, 'other', num(r.mobDemob) * atF);
      pushFlow(flows, months, 'other', num(r.mobDemob) * atF);
    }

    return { granularity: 'monthly', flows: flows,
             detail: { months: months, billable: Math.max(months, minHire) } };
  }

  /* ======================================================================
     PRESENT WORTH / ANNUAL EQUIVALENT
     ====================================================================== */
  function pwOf(flows, granularity, i, timing) {
    var per = granularity === 'monthly' ? 12 : 1;
    var r = per === 12 ? periodRate(i, 12) : i;
    var mid = timing === 'mid';
    var out = { total: 0 };
    for (var k = 0; k < KEYS.length; k++) out[KEYS[k]] = 0;
    for (var f = 0; f < flows.length; f++) {
      var fl = flows[f];
      for (var j = 0; j < KEYS.length; j++) {
        var key = KEYS[j];
        if (!fl[key]) continue;
        var shift = (mid && fl.t > 0 && key !== 'capital' && key !== 'salvage') ? 0.5 : 0;
        var df = Math.pow(1 + r, -(fl.t - shift));
        out[key] += fl[key] * df;
        out.total += fl[key] * df;
      }
    }
    return out;
  }
  Engine.pwOf = pwOf;

  /* Annual table: nominal and discounted cash flows grouped by year */
  function annualTable(flows, granularity, i, nYears, timing) {
    var mid = timing === 'mid';
    var per = granularity === 'monthly' ? 12 : 1;
    var r = per === 12 ? periodRate(i, 12) : i;
    var nYearsCeil = Math.max(1, Math.ceil(nYears - 1e-9));
    var rows = [];
    for (var y = 0; y <= nYearsCeil; y++) {
      var row = { year: y, capital: 0, maint: 0, oper: 0, own: 0, lease: 0, other: 0, salvage: 0,
                  total: 0, discounted: 0, cumDiscounted: 0 };
      rows.push(row);
    }
    for (var f = 0; f < flows.length; f++) {
      var fl = flows[f];
      var yIdx = granularity === 'monthly' ? Math.floor((fl.t - 1e-9) / 12) : Math.round(fl.t);
      if (granularity === 'monthly' && fl.t === 0) yIdx = 0;
      if (granularity === 'annual' && fl.t === 0) yIdx = 0;
      if (yIdx < 0) yIdx = 0;
      if (yIdx >= rows.length) yIdx = rows.length - 1;
      for (var j = 0; j < KEYS.length; j++) {
        var key = KEYS[j];
        if (fl[key]) {
          var shift = (mid && fl.t > 0 && key !== 'capital' && key !== 'salvage') ? 0.5 : 0;
          var df = Math.pow(1 + r, -(fl.t - shift));
          rows[yIdx][key] += fl[key];
          rows[yIdx].total += fl[key];
          rows[yIdx].discounted += fl[key] * df;
        }
      }
    }
    var cum = 0;
    for (var k = 0; k < rows.length; k++) { cum += rows[k].discounted; rows[k].cumDiscounted = cum; }
    return rows;
  }
  Engine.annualTable = annualTable;

  /* ======================================================================
     FULL EVALUATION
     ====================================================================== */
  function evaluateAlt(kind, inp, nYears, i) {
    var built = kind === 'buy' ? buyFlows(inp, nYears)
              : kind === 'lease' ? leaseFlows(inp, nYears)
              : rentFlows(inp, nYears);
    var pw = pwOf(built.flows, built.granularity, i, inp.econ.timing);
    var factor = apf(i, nYears);
    var euac = pw.total * factor;
    var table = annualTable(built.flows, built.granularity, i, nYears, inp.econ.timing);

    /* annualised component breakdown (sums exactly to EUAC) */
    var breakdown = {};
    for (var k = 0; k < KEYS.length; k++) breakdown[KEYS[k]] = pw[KEYS[k]] * factor;
    breakdown.capitalRecovery = breakdown.capital + breakdown.salvage;

    /* average nominal annual maintenance */
    var maintTotal = 0, leaseTotal = 0, operTotal = 0;
    for (var f = 0; f < built.flows.length; f++) {
      maintTotal += built.flows[f].maint;
      leaseTotal += built.flows[f].lease;
      operTotal += built.flows[f].oper;
    }

    var hours = productiveHours(inp);
    return {
      kind: kind,
      pw: pw.total,
      pwParts: pw,
      euac: euac,
      factor: factor,
      breakdown: breakdown,
      flows: built.flows,
      granularity: built.granularity,
      table: table,
      detail: built.detail,
      annualMaintenance: maintTotal / nYears,
      annualLeaseRent: leaseTotal / nYears,
      annualOperating: operTotal / nYears,
      costPerHour: hours > 0 ? euac / hours : 0,
      hours: hours
    };
  }

  function evaluate(inp) {
    var n = analysisYears(inp);
    var i = num(inp.econ.discountRate) / 100;
    var buy = evaluateAlt('buy', inp, n, i);
    var lease = evaluateAlt('lease', inp, n, i);
    var rent = evaluateAlt('rent', inp, n, i);

    var list = [{ k: 'buy', v: buy }, { k: 'lease', v: lease }, { k: 'rent', v: rent }];
    list.sort(function (a, b) { return a.v.euac - b.v.euac; });
    var best = list[0], second = list[1], worst = list[2];

    /* initial cash requirement */
    var b = inp.buy, l = inp.lease, r = inp.rent;
    var dpPct = clamp(num(b.downPaymentPct), 0, 100);
    var loanUsed = (b.financingView === 'owner') || (dpPct < 100 && num(b.loanTenureYears) > 0);
    var buyInitial = loanUsed ? num(b.price) * dpPct / 100 : num(b.price);
    var leaseInitial = num(l.advancePayment) + num(l.deposit);
    var rentInitial = num(r.mobDemob) + monthlyRentalRate(r);

    var out = {
      n: n,
      i: i,
      hours: productiveHours(inp),
      factor: apf(i, n),
      buy: buy, lease: lease, rent: rent,
      best: best.k,
      bestEuac: best.v.euac,
      secondBest: second.k,
      secondEuac: second.v.euac,
      worst: worst.k,
      savings: second.v.euac - best.v.euac,
      savingsPct: second.v.euac > 0 ? (second.v.euac - best.v.euac) / second.v.euac * 100 : 0,
      spread: worst.v.euac - best.v.euac,
      initial: { buy: buyInitial, lease: leaseInitial, rent: rentInitial },
      loanUsed: loanUsed,
      buyFinanced: buyInitial < num(b.price) - 1e-6
    };
    out.ranking = list.map(function (x) { return x.k; });
    return out;
  }
  Engine.evaluate = evaluate;

  /* ======================================================================
     BREAK-EVEN ANALYSIS  (EUAC vs study period)
     ====================================================================== */
  function breakEven(inp, opts) {
    opts = opts || {};
    var maxYears = opts.maxYears || 15;
    var step = opts.step || 0.5;
    var years = [], bArr = [], lArr = [], rArr = [], winners = [];
    var savedN = inp.project.analysisYears;

    for (var y = step; y <= maxYears + 1e-9; y += step) {
      inp.project.analysisYears = y;
      var i = num(inp.econ.discountRate) / 100;
      var bv = evaluateAlt('buy', inp, y, i).euac;
      var lv = evaluateAlt('lease', inp, y, i).euac;
      var rv = evaluateAlt('rent', inp, y, i).euac;
      years.push(+y.toFixed(2)); bArr.push(bv); lArr.push(lv); rArr.push(rv);
      var bestK = bv <= lv && bv <= rv ? 'buy' : (lv <= rv ? 'lease' : 'rent');
      winners.push(bestK);
    }
    inp.project.analysisYears = savedN;

    function cross(a, b) {
      var pts = [];
      for (var k = 1; k < years.length; k++) {
        var d0 = a[k - 1] - b[k - 1], d1 = a[k] - b[k];
        if (d0 === 0) { pts.push(years[k - 1]); continue; }
        if (d0 * d1 < 0) {
          var f = d0 / (d0 - d1);
          pts.push(+(years[k - 1] + f * (years[k] - years[k - 1])).toFixed(2));
        }
      }
      return pts;
    }

    return {
      years: years, buy: bArr, lease: lArr, rent: rArr, winners: winners,
      crossings: {
        'buy-rent': cross(bArr, rArr),
        'buy-lease': cross(bArr, lArr),
        'lease-rent': cross(lArr, rArr)
      }
    };
  }
  Engine.breakEven = breakEven;

  /* ======================================================================
     SENSITIVITY
     ====================================================================== */
  function getPath(obj, path) {
    var parts = path.split('.'), o = obj;
    for (var k = 0; k < parts.length; k++) o = o[parts[k]];
    return o;
  }
  function setPath(obj, path, val) {
    var parts = path.split('.'), o = obj;
    for (var k = 0; k < parts.length - 1; k++) o = o[parts[k]];
    o[parts[parts.length - 1]] = val;
  }
  Engine.getPath = getPath; Engine.setPath = setPath;

  function sensitivity(inp, path, opts) {
    opts = opts || {};
    var base = getPath(inp, path);
    var pct = opts.pct == null ? 40 : opts.pct;
    var steps = opts.steps || 9;
    var lo = base * (1 - pct / 100), hi = base * (1 + pct / 100);
    if (opts.absLo != null) lo = opts.absLo;
    if (opts.absHi != null) hi = opts.absHi;
    var out = [];
    var work = deepClone(inp);
    for (var k = 0; k < steps; k++) {
      var v = steps === 1 ? base : lo + (hi - lo) * k / (steps - 1);
      setPath(work, path, v);
      var res = evaluate(work);
      out.push({
        x: v,
        buy: res.buy.euac, lease: res.lease.euac, rent: res.rent.euac,
        best: res.best, base: false
      });
    }
    return { path: path, base: base, lo: lo, hi: hi, points: out };
  }
  Engine.sensitivity = sensitivity;

  /* Sweep a discrete dimension (duration / utilization) */
  function sweep(inp, path, values) {
    var work = deepClone(inp), out = [];
    for (var k = 0; k < values.length; k++) {
      setPath(work, path, values[k]);
      var res = evaluate(work);
      out.push({ x: values[k], buy: res.buy.euac, lease: res.lease.euac, rent: res.rent.euac, best: res.best });
    }
    return out;
  }
  Engine.sweep = sweep;

  /* ======================================================================
     VALIDATION
     ====================================================================== */
  function validate(inp) {
    var errors = [], warnings = [];
    var p = inp.project, e = inp.econ, b = inp.buy, l = inp.lease, r = inp.rent;
    var n = analysisYears(inp);

    if (!p.name || !String(p.name).trim()) warnings.push('Project name is empty — it will appear blank on the report cover.');
    if (num(p.durationMonths) <= 0) errors.push('Project duration must be greater than zero.');
    if (num(p.hoursPerYear) <= 0) errors.push('Expected operating hours per year must be greater than zero.');
    if (num(p.hoursPerYear) > 8760) errors.push('Operating hours per year cannot exceed 8,760 (hours in a year).');
    if (num(p.utilizationPct) <= 0 || num(p.utilizationPct) > 100) errors.push('Utilization must be between 0 and 100 percent.');
    if (n <= 0) errors.push('Analysis period must be greater than zero.');
    if (num(p.minCapacity) < 0) errors.push('Minimum required capacity cannot be negative.');

    if (num(e.discountRate) < 0) errors.push('Discount rate cannot be negative.');
    if (num(e.discountRate) > 100) warnings.push('Discount rate above 100% is unusual — check the entry.');
    if (num(e.taxRate) < 0 || num(e.taxRate) >= 100) errors.push('Tax rate must be between 0 and 100 percent.');
    if (e.afterTax && num(e.taxRate) <= 0) warnings.push('After-tax analysis is selected but the tax rate is zero — results equal the before-tax case.');

    if (num(b.price) <= 0) errors.push('Buy option: purchase price must be greater than zero.');
    if (num(b.downPaymentPct) < 0 || num(b.downPaymentPct) > 100) errors.push('Buy option: down payment must be between 0 and 100 percent of price.');
    if (num(b.downPaymentPct) > 0 && num(b.downPaymentPct) < 100 && num(b.loanTenureYears) <= 0)
      errors.push('Buy option: a loan tenure is required when the equipment is financed.');
    if (num(b.loanRate) < 0) errors.push('Buy option: loan interest rate cannot be negative.');
    if (num(b.economicLifeYears) <= 0) errors.push('Buy option: economic life must be greater than zero.');
    if (num(b.economicLifeYears) > 0 && n > num(b.economicLifeYears) + 1e-9) {
      if (b.replacement) warnings.push('Analysis period exceeds the economic life — a replacement purchase is being modelled at the end of each life cycle.');
      else warnings.push('Analysis period (' + n.toFixed(2) + ' yr) exceeds the economic life (' + num(b.economicLifeYears).toFixed(2) + ' yr). Enable replacement, or the machine is assumed to serve the whole period without renewal.');
    }
    if (num(b.resaleValue) < 0) errors.push('Buy option: resale value cannot be negative.');
    if (num(b.resaleValue) > num(b.price)) warnings.push('Resale value exceeds the purchase price — check that the residual is realistic.');
    if (num(b.maintenanceYear1) < 0 || num(b.maintenanceEscalationPct) < -100)
      errors.push('Buy option: maintenance costs and escalation must be valid positive values.');

    if (num(l.payment) <= 0 && num(l.advancePayment) <= 0)
      errors.push('Lease option: enter a lease payment or an advance payment.');
    if (num(l.termMonths) <= 0) errors.push('Lease option: lease term must be greater than zero months.');
    if (num(l.deposit) < 0) errors.push('Lease option: security deposit cannot be negative.');
    if (num(l.depositReturnMonth) > num(l.termMonths) && num(l.deposit) > 0)
      warnings.push('Lease option: the deposit return month is after the lease term — it is treated as returned at the end of the term.');
    if (n * 12 > num(l.termMonths) + 1e-6 && num(l.payment) > 0)
      warnings.push('Lease term is shorter than the analysis period — the lease is assumed to be renewed on the same terms.');
    if (num(l.escalationPct) < -100) errors.push('Lease option: escalation cannot be below -100%.');

    if (num(r.rateValue) <= 0) errors.push('Rent option: rental rate must be greater than zero.');
    if (num(r.minHireMonths) < 0) errors.push('Rent option: minimum hire period cannot be negative.');
    if (num(r.downtimePct) < 0 || num(r.downtimePct) > 100) errors.push('Rent option: downtime allowance must be between 0 and 100 percent.');
    if (r.rateBasis === 'day' && num(r.daysPerMonth) <= 0) errors.push('Rent option: billable days per month must be greater than zero.');
    if (num(r.durationMonths) > 0) {
      var rMonths = Math.round(num(r.durationMonths));
      var pMonths = Math.round(n * 12);
      if (Math.abs(rMonths - pMonths) > 0.5) {
        warnings.push('Rent option: the hire period (' + rMonths + ' months) differs from the analysis period (' +
          pMonths + ' months). The machine is only billed for the hire period entered, so the alternatives are not ' +
          'strictly like-for-like.');
      }
    }

    var hours = productiveHours(inp);
    if (hours > 0 && hours < 100) warnings.push('Productive hours per year are very low (' + Math.round(hours) + ' h) — per-hour costs will be dominated by ownership charges.');

    return { errors: errors, warnings: warnings, ok: errors.length === 0 };
  }
  Engine.validate = validate;

     ====================================================================== */
  var EQUIPMENT = [

     Equipment registry. EQUIPMENT holds the illustrative samples shipped
     with the tool; the UI layer keeps the user's own records in local

     use the same field names, so every calculation path works unchanged.

  var CUSTOM = [];

  };

    for (var k = 0; k < CUSTOM.length; k++) if (CUSTOM[k].id === id) return CUSTOM[k];
    for (var j = 0; j < EQUIPMENT.length; j++) if (EQUIPMENT[j].id === id) return EQUIPMENT[j];
    return EQUIPMENT[0];
  }

      },

  /* ------------------------------------------------------ INR formatting */
  function formatINR(v, opts) {
    opts = opts || {};
    var x = num(v);
    var neg = x < 0;
    x = Math.abs(x);
    var dec = opts.dec == null ? 0 : opts.dec;
    var s = x.toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return (neg ? '\u2212\u20B9' : '\u20B9') + s;
  }
  function compactINR(v) {
    var x = num(v);
    var neg = x < 0; x = Math.abs(x);
    var s;
    if (x >= 1e7) s = (x / 1e7).toFixed(2) + ' Cr';
    else if (x >= 1e5) s = (x / 1e5).toFixed(2) + ' L';
    else if (x >= 1e3) s = (x / 1e3).toFixed(1) + ' k';
    else s = x.toFixed(0);
    return (neg ? '\u2212\u20B9' : '\u20B9') + s;
  }
  Engine.formatINR = formatINR;
  Engine.compactINR = compactINR;

  Engine.VERSION = '1.0.0';

  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  global.Engine = Engine;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>

function fx(v, d) { return isFinite(v) ? v.toFixed(d == null ? 1 : d) : '\u2014'; }
function axisINR(v) {
  /* compact axis labels, no currency glyph: keeps dense axes legible */
  var x = Math.abs(v), sign = v < 0 ? '\u2212' : '';
  if (x >= 1e7) return sign + (x / 1e7).toFixed(1) + ' Cr';
  if (x >= 1e5) return sign + (x / 1e5).toFixed(x >= 1e6 ? 0 : 1).replace(/\.0$/, '') + ' L';
  if (x >= 1e3) return sign + (x / 1e3).toFixed(0) + 'k';
  return sign + x.toFixed(0);
}
function pctf(v, d) { return isFinite(v) ? v.toFixed(d == null ? 1 : d) + '%' : '\u2014'; }
function durText(v) {
  if (!isFinite(v) || v <= 0) return '\u2014';
  if (v < 1) return Math.round(v * 12) + ' months';

var MONO = "'IBM Plex Mono', ui-monospace, monospace";

function baseOpts(opts) {
  opts = opts || {};
  var o = {
    responsive: true,

}

function euacBarConfig(res) {

  return {
    type: 'bar',

      labels: labels,
      datasets: [{
        label: 'Equivalent uniform annual cost',
        data: vals,
        backgroundColor: cols,
        borderRadius: 5,
        borderWidth: 0,
        barPercentage: 0.58,
        categoryPercentage: 0.7
      }]

    options: baseOpts({
      legend: false,
      yTitle: 'EUAC per year (INR)',

        label: function (c) {

function stackedConfig(res) {

function durationConfig(be) {

function sweepConfig(points, xlabel, fmt, extra) {
  fmt = fmt || tickNum;
  extra = extra || {};

      datasets: [

              onChange=${function (e) { setSaveName(e.target.value); }}
              onKeyDown=${function (e) { if (e.key === 'Enter') { doSave(); } }} />
            <button className="btn btn--dark btn--sm" onClick=${doSave}>Save current analysis</button>
            <span className="tiny dim">${scns.length === 0 ? 'Nothing saved yet' : scns.length + ' saved'}</span>
          </div>

          ${scns.length === 0
            ? html`<div className="scn-empty">
                <b>No scenarios yet.</b> Set up an analysis on the Inputs page, then save it here under a name.
                A saved scenario keeps every input — project, economic parameters and all three cost structures —
                so you can come back to it, or compare a 3-month run against a 36-month one.
              </div>`
            : html`<div className="scn-list">${scns.map(function (s) {
                var isRenaming = renamingId === s.id;
                return html`<div key=${s.id} className="scn">
                  <div className="scn__main">
                    ${isRenaming
                      ? html`<div className="scn__rename">
                          <input className="input" type="text" value=${renameText} autoFocus
                            onChange=${function (e) { setRenameText(e.target.value); }}
                            onKeyDown=${function (e) {
                              if (e.key === 'Enter') { props.renameScenario(s.id, renameText); setRenamingId(null); }
                              if (e.key === 'Escape') { setRenamingId(null); }
                            }} />
                          <button className="btn btn--dark btn--sm" onClick=${function () { props.renameScenario(s.id, renameText); setRenamingId(null); }}>Save</button>
                          <button className="btn btn--line btn--sm" onClick=${function () { setRenamingId(null); }}>Cancel</button>
                        </div>`
                      : html`<div className="scn__name">${s.name}</div>`}
                    <div className="scn__meta">
                      ${s.equipment} \u00b7 ${s.duration} \u00b7
                      <span style=${{ color: 'var(--green)', fontWeight: 600 }}>${ALTNAME(s.best)} ${INR(s.euac)}/yr</span>
                      \u00b7 ${s.date}
                    </div>
                  </div>
                  ${isRenaming ? null : html`<div className="scn__acts">
                    <button className="btn btn--dark btn--sm" onClick=${function () { props.loadScenario(s); }}>Load</button>
                    <button className="btn btn--line btn--sm" onClick=${function () { setRenamingId(s.id); setRenameText(s.name); }}>Rename</button>
                    <button className="btn btn--line btn--sm" onClick=${function () { props.duplicateScenario(s.id); }}>Copy</button>
                    <button className="btn btn--line btn--sm scn__del" onClick=${function () { props.deleteScenario(s.id); }}>Delete</button>
                  </div>`}
                </div>`;
              })}</div>`}
        <//>
      </div>

      <div className="section">
        <div className="grid g2">
          <${Card}>
            <div className="card__head">
              <div>
                <div className="kicker">Live</div>
                <h3>Current analysis</h3>
              </div>
              <${Badge} tone=${res.best}>${ALTNAME(res.best) + ' lowest'}<//>
            </div>
            <div className="kv" style=${{ gap: '9px 14px' }}>
              <dt>Project</dt><dd style=${{ textAlign: 'right', overflowWrap: 'anywhere' }}>${inputs.project.name || '\u2014'}</dd>
              <dt>Equipment</dt><dd style=${{ textAlign: 'right', overflowWrap: 'anywhere' }}>${eq.name}</dd>
              <dt>Study period</dt><dd>${durText(res.n)}</dd>
              <dt>Discount rate</dt><dd>${pctf(res.i * 100)}</dd>
              <dt>Productive hours</dt><dd>${Math.round(res.hours) + ' h/yr'}</dd>
              <dt>Buy / Lease / Rent</dt>
              <dd style=${{ fontSize: '11.5px' }}>${COMP(res.buy.euac) + ' / ' + COMP(res.lease.euac) + ' / ' + COMP(res.rent.euac)}</dd>
            </div>
            <div className="pill-row" style=${{ marginTop: '14px' }}>
              <button className="btn btn--line btn--sm" onClick=${function () { props.go('inputs'); }}>Edit inputs</button>
              <button className="btn btn--line btn--sm" onClick=${function () { props.go('results'); }}>Results</button>
              <button className="btn btn--primary btn--sm" onClick=${function () { props.go('report'); }}>Report</button>
            </div>
          <//>

          <${Card}>
            <div className="card__head">
              <div>
                <div className="kicker">Method note</div>
                <h3>Why EUAC and not just total cost</h3>
              </div>
            </div>
            <p className="small" style=${{ color: 'var(--ink-2)' }}>
              Buying front-loads a large capital outflow and leaves a residual asset; renting spreads
              small payments and leaves nothing. Comparing raw totals is meaningless because the
              amounts land at different times and the alternatives have different asset endings.
              EUAC removes both problems: every stream is discounted to present worth and then spread
              evenly across the study period, so the three numbers are directly comparable.
            </p>
            <p className="small" style=${{ color: 'var(--ink-2)', marginBottom: 0 }}>
              The lowest EUAC is preferred <b>only if all alternatives deliver the same service</b>
              \u2014 same capacity, availability and condition. Costs identical under all three
              (site fuel, operator wages, general overhead) are excluded, because they cannot change
              the ranking.
            </p>
          <//>
        </div>
      </div>

      <div className="note note--info">
        <b>Scope of this model.</b> All figures are in Indian rupees and follow the Indian numbering
        system. The engine performs a cost-only comparison (a cost analysis, not a revenue analysis),
        so no income or productivity benefit is modelled \u2014 only the cost of securing the machine's service.
      </div>
    </div>
  </div>`;
}

/* -------------------------------------------------------------- inputs */

            <${Badge} tone="win">${ALTNAME(props.results.best)} is lowest<//>
            <div className="tiny dim" style=${{ marginTop: '6px' }}>
              ${COMP(props.results.savings)} per year cheaper than ${ALTNAME(props.results.secondBest)}.

          </div>
          <div style=${{ marginTop: '14px', display: 'grid', gap: '7px' }}>
            <button className="btn btn--primary btn--sm" style=${{ justifyContent: 'center' }} onClick=${function () { props.go('results'); }}>Calculate and view results</button>
            <button className="btn btn--line btn--sm" style=${{ justifyContent: 'center' }} onClick=${function () { props.go('breakeven'); }}>Break-even analysis</button>
          </div>
        <//>
      </div>
    </div>
  </div>`;
}

<script>
/* =========================================================================
   EquipWise — UI part 2: results, break-even, sensitivity, report, root

/* --------------------------------------------------------- cash flow tbl */
function CashFlowTable(props) {
  var alt = props.alt;
  var rows = alt.table;
  var maxRows = props.maxRows || 14;
  var shown = rows;
  var truncated = false;
  if (rows.length > maxRows) {
    shown = rows.slice(0, maxRows - 1).concat([rows[rows.length - 1]]);
    truncated = true;
  }
  return html`<div className="tbl-wrap tbl-wrap--scroll">
    <table className="tbl tbl--wide">
      <thead>
        <tr>
          <th>Year</th>
          <th>Capital</th>
          <th>Maint.</th>
          <th className="col-md-hide">Fuel / oper.</th>
          <th className="col-md-hide">Ownership</th>
          <th>Lease / rent</th>
          <th className="col-md-hide">Other</th>
          <th>Salvage</th>
          <th>Net flow</th>
          <th>Discounted</th>
          <th>Cumulative</th>
        </tr>
      </thead>
      <tbody>
        ${shown.map(function (r, i) {
          var gap = truncated && i === shown.length - 2;
          var c = function (v) { return (gap || Math.abs(v) < 0.5) ? '\u2014' : INR(v); };
          return html`<tr key=${'r' + i}>
            <td>${gap ? '\u22ee' : (r.year === 0 ? '0 (now)' : 'Year ' + r.year)}</td>
            <td className="n">${gap ? '' : c(r.capital)}</td>
            <td className="n">${gap ? '' : c(r.maint)}</td>
            <td className="n col-md-hide">${gap ? '' : c(r.oper)}</td>
            <td className="n col-md-hide">${gap ? '' : c(r.own)}</td>
            <td className="n">${gap ? '' : c(r.lease)}</td>
            <td className="n col-md-hide">${gap ? '' : c(r.other)}</td>
            <td className="n">${gap ? '' : c(r.salvage)}</td>
            <td className="n">${gap ? '' : INR(r.total)}</td>
            <td className="n">${gap ? '' : INR(r.discounted)}</td>
            <td className="n">${gap ? '' : INR(r.cumDiscounted)}</td>
          </tr>`;
        })}
      </tbody>
    </table>

    <div className="cf-summary">
      <div className="cf-summary__row">
        <span className="cf-summary__k">Present worth</span>
        <span className="cf-summary__n">Sum of discounted flows at ${pctf(props.rate * 100)}</span>
        <span className="cf-summary__v">${INR(alt.pw)}</span>
      </div>
      <div className="cf-summary__row">
        <span className="cf-summary__k">EUAC</span>
        <span className="cf-summary__n">PW \u00d7 (A/P, ${pctf(props.rate * 100)}, ${fx(props.n, 2)}) = PW \u00d7 ${kfactor(alt.factor)}</span>
        <span className="cf-summary__v">${INR(alt.euac)}</span>
      </div>
    </div>
    <div className="tbl-foot">
      ${alt.granularity === 'monthly'
        ? 'Monthly payments are discounted individually at the equivalent monthly rate, then grouped into year bands for display.'
        : 'Annual flows are prorated where the analysis period ends part-way through a year.'}
      ${truncated ? ' Middle years omitted for length.' : ''}
      <span className="only-narrow"> Fuel, ownership and other cost columns are hidden at this width; their amounts are still inside the net flow.</span>
    </div>
  </div>`;
}

function bestReason(res, inp) {
  if (res.best === 'rent') {
    return 'Hiring wins because the deployment is short relative to the equipment\u2019s economic life: the capital recovery charge on ' +
      COMP(inp.buy.price) + ' spread over ' + durText(res.n) + ' cannot be recovered through utilization, whereas the rental rate charges only for the period used.';
  }
  if (res.best === 'lease') {
    return 'Leasing wins because it removes the capital recovery charge while still avoiding the higher per-month hire rate: the rentals plus the lessee\u2019s incidental costs annualise below both ownership and short-term hire.';
  }
  return 'Ownership wins because the annualised capital recovery, net of the residual value recovered at the end, falls below the cumulative lease or rental charges over a deployment of this length.';
}

/* ----------------------------------------------------------- break-even */
function beNarrative(segs) {
  if (!segs.length) return '';
  if (segs.length === 1) {
    return ALTNAME(segs[0].k) + ' remains the cheapest alternative across the whole 0.5 to 15 year range tested. ' +
      'No break-even point exists here: one route dominates at every duration, so the decision is insensitive to how long the machine is kept.';
  }
  var order = segs.map(function (s2) {
    return ALTNAME(s2.k) + ' is cheapest from ' + fx(s2.from, 1) + ' to ' + fx(s2.to, 1) + ' years';
  }).join('; ');
  var shortWin = segs[0].k;
  var tail = shortWin === 'rent'
    ? ' Renting is the more economical route for short deployments, where the capital recovery charge on the purchase price cannot be spread over enough productive hours; buying becomes competitive once the machine is used over a sufficiently long period and the residual value is recovered at the end.'
    : shortWin === 'lease'
      ? ' Contract hire is the cheaper way to secure a short deployment on these terms, because the lease payment sits below the open-market rental rate while still avoiding the capital outlay; ownership overtakes it once the annualised capital recovery, net of residual value, falls below the continuing lease charge.'
      : ' Ownership is already the cheapest route at the shortest deployment tested, so the annualised capital recovery plus ownership costs stays below both the lease and the rental charge even over a few months.';
  return order + '.' + tail;
}

function BreakEvenPage(props) {
  var be = props.be, res = props.results, inp = props.inputs;

  var segs = [];
  be.winners.forEach(function (w, i) {
    var last = segs[segs.length - 1];
    if (last && last.k === w) last.to = be.years[i];
    else segs.push({ k: w, from: be.years[i], to: be.years[i] });
  });

  var pairs = [
    { id: 'buy-rent', a: 'Buy', b: 'Rent', v: be.crossings['buy-rent'] },
    { id: 'buy-lease', a: 'Buy', b: 'Lease', v: be.crossings['buy-lease'] },
    { id: 'lease-rent', a: 'Lease', b: 'Rent', v: be.crossings['lease-rent'] }
  ];

  var tableYears = [0.5, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15].filter(function (y) { return y <= be.years[be.years.length - 1] + 1e-9; });

  return html`<div className="wrap page">
    <${SecHead} label="Step 3 of 3 \u00b7 Break-even"
      title="At what deployment length does the answer change?"
      sub="Each alternative is re-evaluated at every half-year from 0.5 to 15 years on identical assumptions. The crossover points are where two EUAC curves intersect."
      right=${html`<button className="btn btn--line btn--sm" onClick=${function () { props.go('sensitivity'); }}>Sensitivity analysis</button>`} />

    <${Card}>
      <div className="card__head" style=${{ marginBottom: '6px' }}>
        <div>
          <div className="kicker">Break-even chart</div>
          <h3>EUAC against study period</h3>
          <p className="small dim" style=${{ margin: '5px 0 0' }}>Lower is cheaper. Where two lines cross, the cheaper route changes.</p>
        </div>
      </div>
      <${ChartBox} config=${durationConfig(be)} height=${380} regKey="be" />

      <div className="be-strip">
        ${pairs.map(function (p) {

            <div className="be-strip__n">
              ${p.v.length

    <//>

        <p className="small" style=${{ color: 'var(--ink-2)' }}>${beNarrative(segs)}</p>
        <p className="small" style=${{ color: 'var(--ink-2)', marginBottom: 0 }}>
          ${'The buying curve is not a straight line: it falls steeply at first because the fixed purchase price is spread over more years, then flattens as maintenance escalation offsets the spreading effect' +
            (inp.buy.replacement ? ', with a step at each economic-life boundary where a replacement machine is bought' : '') +
            '. Rental and lease curves are almost linear because their cost is proportional to time.'}
        </p>
        <div className="be-now">
          <span className="be-now__k">Where your analysis sits</span>
          ${'At a study period of ' + durText(res.n) + ', ' + ALTNAME(res.best) + ' is the cheapest route at ' + INR(res.bestEuac) + ' per year \u2014 ' + INR(res.savings) + ' below ' + ALTNAME(res.secondBest) + '.'}
        </div>
      <//>

      <${Card}>
        <div className="card__head"><div><div className="kicker">Method</div><h3>Assumptions behind the sweep</h3></div></div>
        <div className="assump" style=${{ gridTemplateColumns: 'repeat(auto-fit, minmax(210px, 1fr))', gap: '10px' }}>
          <div className="assump__item">
            <h5>Rental duration tracks the study period</h5>
            <p>Hire runs for the whole period at the entered rate, so the rental curve rises with duration.</p>
          </div>
          <div className="assump__item">
            <h5>Lease renewal</h5>

          </div>
          <div className="assump__item">
            <h5>Economic life and replacement</h5>
            <p>${inp.buy.replacement
              ? 'Replacement machines are bought at every ' + fx(inp.buy.economicLifeYears, 1) + '-year boundary, each with its own residual.'
              : 'One machine serves any duration tested, up to and beyond its ' + fx(inp.buy.economicLifeYears, 1) + '-year life. Enable replacement for a more conservative curve.'}</p>
          </div>
          <div className="assump__item">
            <h5>Residual value</h5>
            <p>Held at ${INR(inp.buy.resaleValue)} at every duration, as the amount recoverable at the end.</p>

    </div>

    <${Card} className="card--flush">
      <div style=${{ padding: '20px 22px 8px' }}>
        <div className="kicker" style=${{ fontFamily: 'var(--f-mono)', fontSize: '10px', letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--ink-4)' }}>Table</div>
        <h3 style=${{ marginTop: '4px' }}>EUAC at selected durations</h3>
      </div>
      <div className="tbl-wrap">
